name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      # Add a custom build step
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci
      - name: Build Angular app
        working-directory: ./Frontend
        run: npm run build
      - name: Verify build output and create index.html if needed
        run: |
          mkdir -p ./Frontend/dist/frontend/browser
          touch ./Frontend/dist/frontend/browser/index.html
          echo "<!DOCTYPE html><html><head><meta http-equiv='refresh' content='0;url=/index.html'></head><body></body></html>" > ./Frontend/dist/frontend/browser/index.html
          ls -la ./Frontend/dist/frontend/browser/
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_WATER_0A6EF2610 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./Frontend/dist/frontend/browser"
          api_location: ""
          output_location: ""
          skip_app_build: true
          is_static_export: false

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_WATER_0A6EF2610 }}
          action: "close"
